<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>ADT | Classes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<script src="js/storage.js"></script>
<script>Auth.requireRole();</script>

<nav class="navbar">
  <div class="logo">📘 ADT</div>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="dash">
  <h1 id="pageTitle">Classes</h1>
  <p id="pageSubtitle"></p>
</div>

<div class="container-fluid px-5">
  <!-- Student: join form. Teacher: create form. -->
  <div id="actionPanel" class="card p-3 mb-4" style="background:#171a23; border:1px solid #1f2933;"></div>

  <h3 class="mb-3 ms-2">My Classes</h3>
  <div id="classList" class="row g-3"></div>
</div>

<!-- Teacher: create class modal -->
<div class="modal fade" id="createClassModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create Class</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="className" class="form-label">Class name <span class="text-danger">*</span></label>
          <input type="text" id="className" class="form-control" placeholder="e.g. Algebra II — Period 3" required />
        </div>
        <div class="mb-3">
          <label for="classSubject" class="form-label">Subject <span class="text-danger">*</span></label>
          <input type="text" id="classSubject" class="form-control" placeholder="e.g. Mathematics" required />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="createClassBtn" class="btn btn-success">Create</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/classes.js"></script>

</body>
</html>
