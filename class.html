<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>ADT | Class</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<script src="js/storage.js"></script>
<script>Auth.requireRole();</script>

<nav class="navbar">
  <div class="logo">📘 ADT</div>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="dash">
  <p class="mb-1"><a href="classes.html" class="text-info">← Back to Classes</a></p>
  <h1 id="className">Loading...</h1>
  <p id="classMeta" class="text-muted"></p>
</div>

<div class="container-fluid px-5">
  <div class="row g-4">
    <div id="assignmentsCol" class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Assignments</h3>
        <button id="createAssignmentBtn" class="btn btn-success" style="display:none;">+ Create Assignment</button>
      </div>
      <div id="assignmentList"></div>
    </div>

    <div id="rosterCol" class="col-lg-5" style="display:none;">
      <h3 class="mb-3">Roster</h3>
      <div id="rosterList"></div>
    </div>
  </div>
</div>

<!-- Teacher: create assignment modal -->
<div class="modal fade" id="createAssignmentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Assignment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="assignmentTitle" class="form-label">Title <span class="text-danger">*</span></label>
          <input type="text" id="assignmentTitle" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="assignmentDescription" class="form-label">Description / instructions</label>
          <textarea id="assignmentDescription" class="form-control" rows="4"></textarea>
        </div>
        <div class="mb-3">
          <label for="assignmentDeadline" class="form-label">Deadline <span class="text-danger">*</span></label>
          <input type="datetime-local" id="assignmentDeadline" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="assignmentPriority" class="form-label">Priority</label>
          <select id="assignmentPriority" class="form-select">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="saveAssignmentBtn" class="btn btn-success">Create</button>
      </div>
    </div>
  </div>
</div>

<!-- Student: submit modal (reused) -->
<div class="modal fade" id="submitModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="submitModalLabel">Submit Assignment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="assignmentMeta" class="mb-3"></div>
        <div class="mb-3">
          <label for="submissionContent" class="form-label">Your answer / notes</label>
          <textarea id="submissionContent" class="form-control" rows="6"></textarea>
        </div>
        <div class="mb-3">
          <label for="submissionLink" class="form-label">Link — optional</label>
          <input type="url" id="submissionLink" class="form-control" placeholder="https://..." />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="saveDraftBtn" class="btn btn-outline-light">Save Draft</button>
        <button type="button" id="submitBtn" class="btn btn-success">Submit</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/class.js"></script>

</body>
</html>
