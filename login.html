<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<title>Login - Assignment Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  body { background: #0f172a; }
</style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card text-light p-4 shadow" style="width: 360px; background: #1e293b;">
  <h2 class="text-center mb-4">Login</h2>

  <form id="loginForm">
    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="Email" required>
    </div>

    <div class="mb-3">
      <input type="password" id="password" class="form-control"
        placeholder="Password"
        pattern="^(?=.*[A-Z])(?=.*[!@#$%^&*])(?=.*[0-9]).{8,}$"
        title="Password must contain 1 uppercase, 1 number, 1 special character and be at least 8 characters"
        required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Login</button>

    <p class="text-center mt-3 mb-0">
      Don't have an account? <a href="signup.html" class="link-info">Sign up</a>
    </p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:5050/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (res.ok) {
    localStorage.setItem("token", data.token);
    alert("Login successful");
    window.location.href = "index.html";
  } else {
    alert(data.message || "Login failed");
  }
});
</script>

</body>
</html>
