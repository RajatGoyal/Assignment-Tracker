<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<title>Signup - Assignment Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  body { background: #0f172a; }
</style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card text-light p-4 shadow" style="width: 360px; background: #1e293b;">
  <h2 class="text-center mb-4">Sign Up</h2>

  <form id="signupForm">
    <div class="mb-3">
      <input type="text" id="name" class="form-control" placeholder="Full Name" required>
    </div>

    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="Email" required>
    </div>

    <div class="mb-2">
      <input type="password" id="password" class="form-control"
        placeholder="Password"
        pattern="^(?=.*[A-Z])(?=.*[!@#$%^&*])(?=.*[0-9]).{8,}$"
        title="Password must contain 1 uppercase, 1 number, 1 special character and be at least 8 characters"
        required>
    </div>

    <div class="form-text text-light-emphasis mb-3">
      Password must include:<br>
      &bull; 1 uppercase letter<br>
      &bull; 1 number<br>
      &bull; 1 special character<br>
      &bull; Minimum 8 characters
    </div>

    <button type="submit" class="btn btn-success w-100">Create Account</button>

    <p class="text-center mt-3 mb-0">
      Already have an account? <a href="login.html" class="link-info">Login</a>
    </p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById("signupForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:5050/api/auth/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, password })
  });

  const data = await res.json();

  if (res.ok) {
    alert("Account created successfully!");
    window.location.href = "login.html";
  } else {
    alert(data.error || data.message || "Signup failed");
  }
});
</script>

</body>
</html>
