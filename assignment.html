<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>ADT | Assignment</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<script src="js/storage.js"></script>
<script>Auth.requireRole("teacher");</script>

<nav class="navbar">
  <div class="logo">📘 ADT</div>
  <div class="nav-links">
    <a href="classes.html">Classes</a>
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</nav>

<div class="dash">
  <p class="mb-1"><a id="backLink" href="classes.html" class="text-info">← Back</a></p>
  <h1 id="assignmentTitle">Loading...</h1>
  <p id="assignmentMeta" class="text-muted"></p>
  <p id="assignmentDescription"></p>
</div>

<div class="container-fluid px-5">

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="stat-card total">
        <span class="icon">👥</span>
        <h2 id="totalCount">0</h2>
        <p>Enrolled</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card submitted">
        <span class="icon">✅</span>
        <h2 id="submittedCount">0</h2>
        <p>Submitted</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card completion">
        <span class="icon">📈</span>
        <h2 id="pctSubmitted">0%</h2>
        <p>Submission Rate</p>
      </div>
    </div>
  </div>

  <h3 class="mb-3">Submissions</h3>
  <div class="table-responsive">
    <table class="table table-dark table-hover submission-table">
      <thead>
        <tr>
          <th>Student</th>
          <th>Status</th>
          <th>Submitted At</th>
          <th>Content</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="submissionRows"></tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/assignment.js"></script>
<script>
  document.getElementById("logoutBtn").addEventListener("click", (e) => {
    e.preventDefault();
    Auth.logout();
  });
</script>

</body>
</html>
