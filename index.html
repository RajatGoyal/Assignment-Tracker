<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <title>ADT | Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<script>
if(!localStorage.getItem("token")){
    window.location.href = "login.html";
}
</script>
  <nav class="navbar">
    <div class="logo">📘 ADT</div>
    <div class="nav-links">
      <a class="active" href="index.html">Dashboard</a>
      <a href="calendar.html">Calendar</a>
      <a href="analytics.html">Analytics</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </nav>
  <div class="dash">
    <h1>Dashboard</h1>
    <p>Track and manage all your assignments in one place.</p>
  </div>
  <div class="container">
    <div class="stat-card total">
      <span class="icon">📋</span>
      <h2 id="totalCount">3</h2>
      <p>Total</p>
    </div>

    <div class="stat-card pending">
      <span class="icon">⏳</span>
      <h2 id="pendingCount">2</h2>
      <p>Pending</p>
    </div>

    <div class="stat-card submitted">
      <span class="icon">✅</span>
      <h2 id="submittedCount">1</h2>
      <p>Submitted</p>
    </div>

    <div class="stat-card missed">
      <span class="icon">❌</span>
      <h2 id="missedCount">0</h2>
      <p>Missed</p>
    </div>

    <div class="stat-card completion">
      <span class="icon">📈</span>
      <h2 id="completion">33%</h2>
      <p>Completion</p>
    </div>
  </div>

  <div class="controls">
    <input type="text" class="form-control" placeholder="Search assignments..." />
    <div class="dropdown">
      <button class="btn btn-outline-light dropdown-toggle" type="button" id="statusFilterBtn" data-bs-toggle="dropdown" aria-expanded="false" style="width: 160px;">
        All Status
      </button>
      <ul class="dropdown-menu" aria-labelledby="statusFilterBtn">
        <li><a class="dropdown-item" href="#" onclick="setStatusFilter('All'); return false;">All Status</a></li>
        <li><a class="dropdown-item" href="#" onclick="setStatusFilter('Pending'); return false;">Pending</a></li>
        <li><a class="dropdown-item" href="#" onclick="setStatusFilter('Submitted'); return false;">Submitted</a></li>
        <li><a class="dropdown-item" href="#" onclick="setStatusFilter('Missed'); return false;">Missed</a></li>
      </ul>
    </div>
    <button id="addBtn" class="btn btn-primary">+ Add</button>
  </div>

  <div id="assignmentList"></div>

  </div>

  <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel">Add Assignment</h5>
          <button type="button" class="btn-close" id="closeModal" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
            <input type="text" id="title" class="form-control" placeholder="Assignment title" required />
          </div>

          <div class="mb-3">
            <label for="subject" class="form-label">Subject <span class="text-danger">*</span></label>
            <input type="text" id="subject" class="form-control" placeholder="e.g. Mathematics" required />
          </div>

          <div class="mb-3">
            <label for="deadline" class="form-label">Deadline <span class="text-danger">*</span></label>
            <input type="datetime-local" id="deadline" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="priority" class="form-label">Priority</label>
            <select id="priority" class="form-select">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="saveAssignment" class="btn btn-primary">Add Assignment</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/index.js"></script>
  <script>
    document.getElementById("logoutBtn").addEventListener("click", (e) => {
      e.preventDefault();
      document.cookie = "user=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
      localStorage.removeItem("token");
      window.location.href = "login.html";
    });
  </script>

</body>

</html>
