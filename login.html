```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Assignment Tracker</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:#1e293b;
  padding:40px;
  border-radius:10px;
  width:350px;
  color:white;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:5px;
  border:none;
}

button{
  width:100%;
  padding:12px;
  background:#3b82f6;
  border:none;
  border-radius:5px;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#2563eb;
}

a{
  color:#60a5fa;
}
</style>
</head>

<body>

<div class="container">
<h2>Login</h2>

<form id="loginForm">

<input type="email" id="email" placeholder="Email" required>

<input type="password" id="password"
placeholder="Password"
pattern="^(?=.*[A-Z])(?=.*[!@#$%^&*])(?=.*[0-9]).{8,}$"
title="Password must contain 1 uppercase, 1 number, 1 special character and be at least 8 characters"
required>

<button type="submit">Login</button>

<p style="text-align:center;margin-top:15px;">
Don't have an account? <a href="signup.html">Sign up</a>
</p>

</form>
</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e){

e.preventDefault();

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const res = await fetch("http://localhost:5050/api/auth/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({email,password})
});

const data=await res.json();

if(res.ok){
  document.cookie = "user=loggedin; path=/;";
  alert("Login successful");
  window.location.href="index.html";
}else{
  alert(data.message || "Login failed");
}

});

</script>

</body>
</html>
```
