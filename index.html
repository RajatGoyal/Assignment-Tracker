<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <title>ADT | Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <script src="js/storage.js"></script>
  <script>Auth.requireRole("student");</script>

  <nav class="navbar">
    <div class="logo">📘 ADT</div>
    <div class="nav-links">
      <a class="active" href="index.html">Dashboard</a>
      <a href="calendar.html">Calendar</a>
      <a href="analytics.html">Analytics</a>
      <a href="classes.html">Classes</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </nav>

  <div class="dash">
    <h1>Dashboard</h1>
    <p>Track and submit assignments from your enrolled classes.</p>
  </div>

  <div class="container">
    <div class="stat-card total">
      <span class="icon">📋</span>
      <h2 id="totalCount">0</h2>
      <p>Total</p>
    </div>

    <div class="stat-card pending">
      <span class="icon">⏳</span>
      <h2 id="pendingCount">0</h2>
      <p>Pending</p>
    </div>

    <div class="stat-card submitted">
      <span class="icon">✅</span>
      <h2 id="submittedCount">0</h2>
      <p>Submitted</p>
    </div>

    <div class="stat-card missed">
      <span class="icon">❌</span>
      <h2 id="missedCount">0</h2>
      <p>Missed</p>
    </div>

    <div class="stat-card completion">
      <span class="icon">📈</span>
      <h2 id="completion">0%</h2>
      <p>Completion</p>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" class="form-control" placeholder="Search assignments..." />
    <div class="dropdown">
      <button class="btn btn-outline-light dropdown-toggle" type="button" id="statusFilterBtn" data-bs-toggle="dropdown" aria-expanded="false" style="width: 160px;">
        All Status
      </button>
      <ul class="dropdown-menu" aria-labelledby="statusFilterBtn">
        <li><a class="dropdown-item" href="#" onclick="setStatusFilter('All'); return false;">All Status</a></li>
        <li><a class="dropdown-item" href="#" onclick="setStatusFilter('Pending'); return false;">Pending</a></li>
        <li><a class="dropdown-item" href="#" onclick="setStatusFilter('Submitted'); return false;">Submitted</a></li>
        <li><a class="dropdown-item" href="#" onclick="setStatusFilter('Missed'); return false;">Missed</a></li>
      </ul>
    </div>
  </div>

  <div id="assignmentList"></div>

  <!-- Submit modal -->
  <div class="modal fade" id="submitModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="submitModalLabel">Submit Assignment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div id="assignmentMeta" class="mb-3"></div>

          <div class="mb-3">
            <label for="submissionContent" class="form-label">Your answer / notes</label>
            <textarea id="submissionContent" class="form-control" rows="6" placeholder="Type your answer here..."></textarea>
          </div>

          <div class="mb-3">
            <label for="submissionLink" class="form-label">Link (Google Doc, GitHub, etc.) — optional</label>
            <input type="url" id="submissionLink" class="form-control" placeholder="https://..." />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="saveDraftBtn" class="btn btn-outline-light">Save Draft</button>
          <button type="button" id="submitBtn" class="btn btn-success">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/index.js"></script>
  <script>
    document.getElementById("logoutBtn").addEventListener("click", (e) => {
      e.preventDefault();
      Auth.logout();
    });
  </script>

</body>

</html>
